# 能力地图（SPEC-04 §3）
#
# 4 个分组按用户目标组织，不是按文件格式。
# 顺序 = 本文件中 [groups] 的出现顺序。
#
# item 字段：
#   id      必填。kind="skill" 时必须等于某个技能目录名，否则视为死链被丢弃
#   kind    "skill"（默认，绑定技能）| "chat"（纯对话能力，无 run.py，skill_id=null）
#   group   必须是 [groups] 里已定义的分组名
#   maturity 仅 kind="chat" 需要；kind="skill" 的 maturity 一律从技能继承

[groups]
"做内容 · 要成品" = { desc = "给一句主题，产出能直接发的东西" }
"做运营 · 要动作" = { desc = "把「今天发什么」变成明确的下一步" }
"做账号 · 要增长" = { desc = "用真实数据反过来改内容" }
"做系统 · 要配置" = { desc = "工具坏了、缺密钥、想体检时用" }

