[project]
name = "atelier"
version = "0.1.0"
description = "Atelier · 面向社交媒体创作者的私有内容工作台"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "claude-agent-sdk",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
  "pillow>=11.0",
  "pypdf>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

# flat-layout 下 setuptools 会扫到 web/prd/plans/specs/design 六个顶层包并直接拒绝构建，
# 必须显式声明只打包 atelier*（PRD D7：atelier/ 是唯一的 Python 包）。
[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["atelier/tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
