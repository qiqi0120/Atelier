[project]
name = "atelier"
version = "0.1.0"
description = "Atelier · 面向社交媒体创作者的私有内容工作台"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "claude-agent-sdk",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
  "pillow>=11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["atelier/tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
